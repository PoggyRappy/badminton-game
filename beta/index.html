<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  document.body.classList.add(isTouch ? 'touch' : 'notouch');

  // 測試版（網址在 /beta/ 底下）：存檔、雲端資料表都跟正式版分開，也不送 GA4，正式版的數據不會被弄亂
  const BETA = /\/beta\//.test(location.pathname) || /beta/.test(location.hash);
  const SK = k => BETA ? k.replace(/^bd_/, 'bdb_') : k; // 存檔的名字
  const COL = n => (BETA ? 'beta_' : '') + n;
  if (BETA) try { // 第一次打開測試版：把這台裝置正式版的進度複製一份過來
    if (!localStorage.getItem('bdb__copied')) {
      const ks = []; for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.startsWith('bd_')) ks.push(k); }
      ks.forEach(k => localStorage.setItem(SK(k), localStorage.getItem(k))); localStorage.setItem('bdb__copied', '1');
    }
  } catch (e) {}
  const store = {
    get(k, d) { try { const v = localStorage.getItem(SK(k)); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(SK(k), v); } catch (e) {} }
  };

  // ---------- 場地與尺寸（公尺） ----------
  const COURT = 13.4, NET_X = 6.7, NET_H = 1.55;
  const G = 9.8, K = 0.17; // 羽球空氣阻力
  let W, H, DPR, S_, OX, GY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const compact = isTouch && H < 560 && W > H;
    document.body.classList.toggle('compact', compact);
    document.body.classList.toggle('portrait', isTouch && H > W);
    GY = compact ? H - 92 : H - (isTouch ? 112 : 60);
    TOP = compact ? 30 : 70;
    // 手機橫向：平常只留 3.6 公尺高，球場放大；球飛高時鏡頭自動拉遠
    MINSPAN = compact ? 3.6 : 6.6;
    if (!span) span = MINSPAN;
    span = Math.max(span, MINSPAN);
    layout();
  }
  let TOP = 70, MINSPAN = 6.6, span = 0;
  function layout() {
    S_ = Math.min(W / 15.2, (GY - TOP) / span);
    OX = (W - COURT * S_) / 2;
  }
  function camera(dt) {
    let want = MINSPAN;
    const g = G_;
    if (g && g.b) want = Math.max(want, Math.min(7.5, g.b.y + 1.1));
    if (g) want = Math.max(want, 2.3 + Math.max(g.p.y, g.a.y) + 0.6);
    span += (want - span) * Math.min(1, dt * (want > span ? 4 : 1.6));
    layout();
  }
  window.addEventListener('resize', resize); resize();
  const px = x => OX + x * S_, py = y => GY - y * S_;

  // ---------- 音效：用雜訊合成羽球擊球聲 ----------
  let ac = null, noiseBuf = null;
  function audio() {
    if (typeof soundOn !== 'undefined' && !soundOn) return null;
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  // 一段經過濾波的雜訊：type 濾波種類、f 頻率、q、dur 長度、vol 音量、delay 延遲
  function burst(type, f, q, dur, vol, delay = 0, f2) {
    const A = audio(); if (!A) return;
    const t0 = A.currentTime + delay, src = A.createBufferSource(), fl = A.createBiquadFilter(), g = A.createGain();
    src.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f, t0); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(A.destination); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  function tone(type, f, f2, dur, vol, delay = 0) {
    const A = audio(); if (!A) return;
    const t0 = A.currentTime + delay, o = A.createOscillator(), g = A.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(A.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function hitSound(kind) {
    try {
      if (kind === 'smash' || kind === 'kill') {        // 殺球：又脆又重的「啪！」＋低頻衝擊
        burst('highpass', 4500, 0.7, 0.025, 0.5);
        burst('bandpass', 1700, 0.8, 0.07, 1.0);
        tone('triangle', 160, 60, 0.09, 0.55);
        tone('sine', 1250, 900, 0.06, 0.07);
      } else if (['net', 'netUnder', 'dropUnder'].includes(kind)) { // 網前輕球：細小的「嗒」
        burst('bandpass', 4600, 2.0, 0.018, 0.22);
        tone('sine', 2100, 1900, 0.03, 0.03);
      } else if (kind === 'slice') {                      // 切球：擦拍的「嘶」
        burst('bandpass', 3400, 1.2, 0.035, 0.38);
        burst('highpass', 6000, 0.5, 0.05, 0.12, 0.005);
      } else if (kind === 'serve') {                      // 反手發小球：輕推
        burst('bandpass', 3900, 1.6, 0.022, 0.25);
      } else {                                            // 高遠、挑、推：清脆的「砰」＋線床回音
        burst('bandpass', 2500, 1.0, 0.045, 0.65);
        tone('sine', 1450, 1250, 0.07, 0.07);
      }
    } catch (e) {}
  }
  function swishSound(strong) { try { burst('bandpass', 500, 1.4, strong ? 0.16 : 0.12, strong ? 0.22 : 0.12, 0, 1800); } catch (e) {} }

  let LANG = store.get('bd_lang', '') || ((navigator.language || 'en').toLowerCase().startsWith('zh') ? 'zh' : 'en');

    if (!voiceOn || !('speechSynthesis' in window)) return false;
    try {
      speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text.replace(/–/g, ' '));
      u.lang = T().speechLang; u.rate = 1.0;
      const v = speechSynthesis.getVoices().find(v => v.lang && v.lang.replace('_', '-').toLowerCase().startsWith(u.lang.toLowerCase().slice(0, LANG === 'zh' ? 5 : 2)));
      if (v) u.voice = v;
      if (onEnd) u.onend = onEnd;
      speechSynthesis.speak(u);
      return true;
    } catch (e) { return false; }
  }
  function unlockSpeech() { // 手機要在點擊時先「解鎖」語音
    try { if ('speechSynthesis' in window) { const u = new SpeechSynthesisUtterance(' '); u.volume = 0; speechSynthesis.speak(u); } } catch (e) {}
  }

  function setupServe() {

    const g = G_;
    g.p.x = g.server === 'p' ? 4.3 : 3.7; g.a.x = g.server === 'a' ? 9.1 : 9.7;

  }

  // BWF：發球、接發球時腳不能踩到或越過前發球線（離網 1.98 公尺）
  const SHORT_LINE = 1.98, FOOT = 0.25;
  const overLine = pl => Math.abs(NET_X - pl.x) - FOOT < SHORT_LINE;
  function doServe(who) {
    const g = G_, pl = g[who], rcv = who === 'p' ? g.a : g.p;
    if (overLine(pl) || overLine(rcv)) { // 誰越線誰犯規
      const bad = overLine(pl) ? who : (who === 'p' ? 'a' : 'p');
      g.b = null; pl.swingType = 'serve'; pl.swingT = contactT('serve');
      showMsg(bad === who ? T().svFault : T().rcvFault, '#ff8a8a', 1400); netSound();
      $('hint').textContent = '';
      decidePoint(bad === 'p' ? 'a' : 'p', false, bad === who ? 'svline' : 'rcvline');
      return;
    }
    const fx = pl.x + (who === 'p' ? 0.45 : -0.45), fy = 1.0;
    g.aiRoll = Math.random(); g.aiJumped = false;
    // 反手發小球：剛好過前發球線
    const d = NET_X + 2.05 + Math.random() * 0.6;
    const tx = who === 'p' ? d : COURT - d;
    const v = shot(fx, fy, tx, 'serve');
    g.b = { x: fx, y: fy, vx: v.vx, vy: v.vy, last: who, net: false, type: 'serve' };
    pl.swingType = 'serve'; pl.swingT = contactT('serve');
    showMsg(who === 'p' ? T().shots.serve : T().opp(T().shots.serve), '#bfe9ff');
    g.state = 'rally'; $('hint').textContent = '';

    hitSound('serve');
    if (who === 'p' && pvpRemote()) pvpSendHit('serve');
  }

  // ---------- 擊球 ----------
  function reach(pl) { return 2.35 + pl.y; }
  function inZone(pl, b) {
    const dx = (b.x - pl.x) * (pl.side === 'p' ? 1 : -1);
    const back = pl.side === 'p' && G_ && G_.pvp ? -0.35 : -0.65; // 好友對戰：球過了身體 0.35 公尺就打不到（闖關維持 0.65，手機比較好打）
    return dx > back && dx < 1.05 && b.y > 0.12 && b.y < reach(pl) &&
      (pl.side === 'p' ? b.x < NET_X : b.x > NET_X) && b.last !== pl.side;
  }

  // 站位分區：離網 2.4 公尺內＝前場、2.4～4.6＝中場、更遠＝後場
  function zoneOf(pl) { const d = Math.abs(pl.x - NET_X); return d < 2.4 ? 'front' : d < 4.6 ? 'mid' : 'back'; }
  function isFront(pl) { return zoneOf(pl) === 'front'; }

  // soft＝「輕」、fwd＝按住往網前（▶）。主動球從上面打，被動球自動改成下手
  function chooseKind(pl, b, soft, fwd) {
    const z = zoneOf(pl), h = b.y, air = pl.y > 0.2;
    if (z === 'front') {
      if (soft) return h >= 1.1 ? 'net' : 'netUnder';
      if (h > 1.9 && b.vy <= 0.5 && (air || fwd)) return 'kill'; // 網前往前壓或跳起來＝撲球（球還在往上飛就撲不下去）
      return h > 1.3 ? 'push' : 'lift';
    }

  // 對手選球：看自己的位置、球的高度、你站哪裡；回傳 { kind, fake }
  function aiChoose(a, b, L, p) {
    const g = G_, z = zoneOf(a), h = b.y, air = a.y > 0.2, R = Math.random();
    let attack, soft;
    if (z === 'front') {

      if (h > 2.0 && b.vy <= 0.5 && (air || Math.random() < L.killP)) return { kind: 'kill' }; // 只撲往下掉或平飛的球
      const tight = Math.abs(b.x - NET_X) < 0.9 && h < NET_H + 0.2; // 貼網、比網帶低的球推不下去，只能放或挑
      attack = h > 1.3 && !tight && !isFront(p) ? 'push' : 'lift'; soft = h >= 1.1 ? 'net' : 'netUnder'; // 你也在網前：不推平球給你撲，改挑高

    }
    if (L.style === 'rookie') { // 學弟：不會平抽、不會殺，大多把球打高

    }
    let kind;
    // 接你的殺球：擋網前或反抽，不再只會挑高（太極模式更愛擋）

  const KIND_RISK = { drive: 1.6, smash: 1.4, kill: 1.3, net: 1.3, block: 1.2, flatClear: 1.2 };

  function hit(who, soft, opt = {}) {
    const g = G_, pl = g[who], b = g.b, L = LEVELS[g.level];

  // ---------- AI ----------
  function aiThink(dt) {
    const g = G_, a = g.a, b = g.b, L = LEVELS[g.level];
    let target = a.x, sp = L.speed;
    const wantJump = L.smashP > 0 && g.aiRoll < L.smashP && g.aiMode !== 'taichi';
    if (g.aiRushT > 0) g.aiRushT -= dt;
    if (b && g.state === 'rally' && b.last === 'p') {
      if (g.aiDelay > 0) g.aiDelay -= dt;
      else {
        g.aiRetarget -= dt;
        if (!g.aiPlan || g.aiRetarget <= 0) {
          g.aiRetarget = 0.1;
          // 預測球掉到可以打的高度在哪；要跳殺就在比較高的位置攔
          const s = { x: b.x, y: b.y, vx: b.vx, vy: b.vy }; let ix = null;
          const catchH = wantJump ? 2.8 : 2.1;
          for (let i = 0; i < 1600 && s.y > 0; i++) {
            step(s, 1 / 120);
            if (s.vy < 0 && s.x > NET_X && s.y < catchH && ix === null) ix = s.x;
          }
          if (ix === null) ix = s.x;
          g.aiPlan = { x: ix + 0.35 };
        }
        target = g.aiPlan.x;
      }
    } else if (g.state === 'rally' && b && b.last === 'a') {
      // 打完回中場：學弟不回位、隊長慢慢回、王牌馬上回
      if (L.recover > 0) { target = g.aiRushT > 0 ? NET_X + 1.4 : (L.base || 9.8); sp *= L.recover; }
    }
    // 被你的假動作騙：先往反方向跑一下
    if (g.aiFeintT > 0 && b && b.last === 'p') { g.aiFeintT -= dt; target = a.x + g.aiFeintDir * 3; }
    const d = target - a.x;
    if (L.backSlow && d > 0) sp *= L.backSlow;          // 往後場退得慢
    if (L.tire && g.rally > 9) sp *= 0.75;               // 來回太長就累了
    a.x += Math.max(-sp * dt, Math.min(sp * dt, d));
    a.x = Math.max(NET_X + 0.35, Math.min(COURT - 0.2, a.x));

    if (b && g.state === 'rally' && b.last === 'p') {
      const near = Math.abs(b.x - a.x) < 1.2 && b.x > NET_X && b.vy < 0;
      if (a.y === 0 && !g.aiJumped && near) {
        if (!isFront(a) && wantJump && b.y > 2.4 && b.y < 3.4) { a.vy = 4.2; g.aiJumped = true; }            // 後場跳殺
        else if (isFront(a) && L.killP > 0 && g.aiRoll < L.killP && b.y > 1.9 && b.y < 2.7) { a.vy = 3.6; g.aiJumped = true; } // 網前撲球

      else if (inZone(a, b)) {

  }

  // ---------- 主更新 ----------
  function updPlayer(pl, dt) {
    if (pl.y > 0 || pl.vy > 0) { pl.vy -= 13 * dt; pl.y += pl.vy * dt; if (pl.y <= 0) { pl.y = 0; pl.vy = 0; } }
    if (pl.swingT >= 0) { pl.swingT += dt; if (pl.swingT > ((SWINGS[pl.swingType] || SWINGS.clear).dur)) pl.swingT = -1; }
    pl.cool = Math.max(0, pl.cool - dt);
  }

  let pendingSwing = null, pendingT = 0, pendingFeint = false, pendingFwd = false, pendingFake = null;
  function willReach(p, b, T) {
    const s = { x: b.x, y: b.y, vx: b.vx, vy: b.vy };
    for (let t = 0; t < T && s.y > 0; t += 1 / 120) { if (inZone(p, s)) return true; step(s, 1 / 120); }
    return false;
  }
  // 預測球接下來會落到可以打的位置，回傳理想站位（球在身體前方 0.35 公尺）；太遠就不幫忙
  function alignX(p, b) {
    if (!b || b.last === 'p') return null;
    const s = { x: b.x, y: b.y, vx: b.vx, vy: b.vy }, top = reach(p) - 0.1;
    for (let i = 0; i < 72 && s.y > 0.3; i++) {
      if (s.x < NET_X && s.y < top && (s.vy < 0 || s.y < 2.0)) {
        const t = Math.max(0.2, Math.min(NET_X - 0.35, s.x - 0.35));
        return Math.abs(t - p.x) < 1.3 ? t : null;
      }
      step(s, 1 / 120);
    }
    return null;
  }
  function playerSwing(type) {
    if (!G_ || G_.over || paused || readyT > 0) return;
    const g = G_, p = g.p;
    if (g.state === 'serve' && g.server === 'p') { doServe('p'); return; }
    // 假動作：剛按了一顆，0.25 秒內改按另一顆 → 做了前一種的動作，打出後一種球
    if (pendingSwing && pendingSwing !== type && !pendingFeint) {

      pendingSwing = type; pendingFeint = true; pendingFake = fakeKind; pendingT = Math.max(pendingT, 0.25);

      return;
    }
    if (p.cool > 0) return;
    p.cool = 0.3;

    if (g.b && g.state === 'rally' && inZone(p, g.b)) { hit('p', soft, { fwd: keys.right }); return; }
    p.swingT = 0; p.swingType = g.b ? chooseKind(p, g.b, soft, keys.right) : 'clear';
    if (pvpRemote()) pvpEv({ k: 'sw', ty: p.swingType }); // 讓對方看到你的揮拍動作（假動作也看得到）
    swishSound(p.swingType === 'smash' || p.swingType === 'kill');
    const smashIntent = keys.right && g.b && g.b.y > 1.7 && !isFront(p); // 按住 ▶ 準備殺高球：可以更早按
    pendingSwing = type; pendingT = smashIntent ? 0.65 : 0.4; pendingFeint = false; pendingFwd = keys.right; // 早按一點也沒關係，球一進範圍就擊出
  }
  function playerJump() { if (paused || readyT > 0) return; const p = G_ && G_.p; if (p && p.y === 0) { p.vy = 4.3; if (pvpRemote()) pvpEv({ k: 'jp' }); } }

  // ---------- 防止手機瀏覽器誤觸放大（iPhone 不理 user-scalable=no，要另外擋）----------
  ['gesturestart', 'gesturechange'].forEach(ev => document.addEventListener(ev, e => e.preventDefault(), { passive: false })); // 兩指縮放
  let lastTap = 0;
  document.addEventListener('touchend', e => { // 連點兩下空白處：不放大（按鈕、輸入框照常）
    const now = Date.now(), tgt = e.target;
    if (now - lastTap < 350 && !(tgt.closest && tgt.closest('button, input, textarea, select, a, label, .ctrl'))) e.preventDefault();
    lastTap = now;
  }, { passive: false });
  document.addEventListener('dblclick', e => e.preventDefault());

  // ---------- 全螢幕（Android Chrome 等支援的瀏覽器） ----------
  const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function goFull() {
    if (!fsOK || isFull()) return;
    try {
      const el = document.documentElement;
      await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    } catch (e) {}
  }
  function toggleFull() {
    if (isFull()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }

  function update(dt) {

    if (pendingSwing && g.state === 'rally' && g.b && g.b.last !== 'p' && !(keys.left && !keys.right)) { // 按住 ◀ 往後退一律照你的意思走
      if (!willReach(p, g.b, pendingT + 0.1)) { const ax = alignX(p, g.b); if (ax !== null) p.x += Math.max(-5.2 * dt, Math.min(5.2 * dt, ax - p.x)); }
    } else p.x += mv * (g.state === 'serve' ? 2.5 : 5.2) * dt; // 發球前可以慢慢調整站位

    // 快落地時對方的結果還沒傳來，就再放慢一點等一下，不會先在你這邊落地、結果對方卻接起來

  // ---------- 練習模式＋新手教學（發球機固定送同一種球） ----------
  // feed：發球機位置 [x, 高度]、落點、球路（或指定仰角）；ch：理想擊球高度（拿來算黃圈站位）

  function setPhase(ph, t) { const dd = G_.drill; dd.phase = ph; dd.t = t; spotlight(); }
  function drillUpdate(dt) {
    const g = G_, dd = g.drill, p = g.p, t = T().dr;
    if (dd.phase === 'move') { // 教學第一步：走到黃圈
      dd.hold = Math.abs(p.x - dd.stand) < 0.3 ? dd.hold + dt : 0;
      if (dd.hold > 0.35) { dd.phase = 'done'; showMsg(t.ok, '#5ce1c6', 900); pointSound(true); setTimeout(() => tutNext(), 900); }
      return;
    }
    if (dd.phase === 'count') {
      const n = Math.ceil(dd.t); dd.t -= dt;
      $('msg').style.opacity = 1; $('msg').classList.add('big'); $('msg').textContent = t.count(n);
      if (Math.ceil(dd.t) !== n && dd.t > 0) tickSound();
      if (dd.t <= 0) { // 發球機出球
        const f = dd.d.feed, v = feedVel(f);
        g.b = { x: f.from[0], y: f.from[1], vx: v.vx, vy: v.vy, last: 'a', type: 'feed', net: false };
        g.trail = []; $('msg').classList.remove('big'); showMsg(t.ready, '#ffe066', 700); hitSound('clear'); setPhase('fly', 0);
      }
      return;
    }
    if (dd.phase === 'rest') { dd.t -= dt; if (dd.t <= 0) { if (dd.next) { const fn = dd.next; dd.next = null; fn(); } else { dd.note = null; drillBar(); setPhase('count', 3); } } return; }
    if (dd.phase !== 'fly') return;
    const b = g.b;
    if (pendingSwing) {
      pendingT -= dt;
      if (inZone(p, b) && ((b.x - p.x) <= 0.45 || pendingT <= 0.05 || b.y < 0.5)) { hit('p', pendingSwing === 'drop', { fwd: pendingFwd || keys.right, feint: pendingFeint, fakeKind: pendingFake }); pendingSwing = null; pendingFeint = false; }
      else if (pendingT <= 0) { pendingSwing = null; pendingFeint = false; }
    }
    const prevX = b.x;
    for (let i = 0; i < 4; i++) step(b, dt / 4);
    if (b.type === 'smash' || Math.hypot(b.vx, b.vy) > 14) g.trail.push({ x: b.x, y: b.y, life: 0.25 });
    if (!b.net && (prevX - NET_X) * (b.x - NET_X) <= 0 && b.y < NET_H) { b.net = true; b.x = NET_X + (prevX < NET_X ? -0.05 : 0.05); b.vx = -b.vx * 0.08; b.vy = Math.min(b.vy, 0) * 0.3; netSound(); }
    if (b.y > 0) return;
    b.y = 0; floorSound();
    // 判定這一球
    const d = dd.d; let res;
    if (b.last !== 'p') res = 'none';
    else if (b.net) res = 'net';
    else if (b.x < NET_X || b.x > COURT) res = 'out';
    else if (!d.ok.includes(b.type) || (d.air && !b.air) || (d.feint && !b.feint)) res = 'wrong';
    else res = 'ok';
    dd.tries++; if (res === 'ok') dd.made++;
    if (res === 'ok') { showMsg(t.ok, '#5ce1c6', 1300); pointSound(true); dd.note = null; }
    else { dd.note = res === 'wrong' ? t.miss.wrong(T().shots[b.type] || b.type) : t.miss[res]; showMsg(res === 'none' ? '✕' : dd.note, '#ff8a8a', 1300); pointSound(false); }
    drillBar();
    if (g.tut) { // 教學：成功一次就下一招；試了 4 次還不行也先往下
      if (res === 'ok') { dd.next = tutNext; setPhase('rest', 1.4); return; }
      if (dd.tries >= 4) { dd.note = t.pass; drillBar(); dd.next = tutNext; setPhase('rest', 2.6); return; }
    }
    setPhase('rest', 1.6);
  }
  function tutNext() {
    const g = G_; if (!g || !g.tut) return;
    const i = g.tut.i + 1;
    if (i < TUT.length) { startTutorial(i); return; }
    setTut('done'); store.set('bd_tutAt', '0'); track('tutorial_done', {});
    drillHud(false); G_ = null; clearHud();
    const t = T().dr; $('tdT').textContent = t.doneT; $('tdP').textContent = t.done; $('tdPlay').textContent = t.play1; $('tdPractice').textContent = t.toPractice;
    if (room) $('tdPlay').textContent = T().rm.backRoom; // 從邀請連結來的：教學完直接回房間
    $('tdPractice').classList.toggle('hidden', !!room);

  }

  // ---------- 自訂按鍵：每顆按鈕的位置（螢幕寬高的比例，換手機也不跑掉）、大小倍率、整體透明度 ----------

  // 預設排列（照目前螢幕大小的 CSS 量出來）
  function ctlDefaults() {
    const body = document.body, had = body.classList.contains('ctlCustom'), inM = body.classList.contains('inMatch');
    const saved = CTL_KEYS.map(k => ctlBtn(k).style.cssText);

    body.classList.add('inMatch');
    const W = innerWidth, H = innerHeight, d = {};
    CTL_KEYS.forEach(k => { const b = ctlBtn(k), r = b.getBoundingClientRect();
      d[k] = { x: (r.left + r.width / 2) / W, y: (r.top + r.height / 2) / H, w: r.width, fs: parseFloat(getComputedStyle(b).fontSize) }; });
    if (!inM) body.classList.remove('inMatch');

  function applyCtl() {
    const body = document.body;
    if (!ctl) { body.classList.remove('ctlCustom'); CTL_KEYS.forEach(k => { ctlBtn(k).style.cssText = ''; }); return; }
    const d = ctlDefaults(), W = innerWidth, H = innerHeight, cs = getComputedStyle(document.documentElement);

      const left = Math.max(m, Math.min(W - size - m, c.x * W - size / 2)), top = Math.max(m, Math.min(H - size - m, c.y * H - size / 2));
      Object.assign(ctlBtn(k).style, { left: left + 'px', top: top + 'px', width: size + 'px', height: size + 'px', fontSize: Math.round(d[k].fs * Math.min(1.3, Math.max(0.8, c.s))) + 'px', opacity: ctl.a ?? 1 });
      rects[k] = { cx: left + size / 2, cy: top + size / 2, r: size / 2 };
    });

  window.addEventListener('resize', () => setTimeout(applyCtl, 60));
  function ctlSyncBar() {

  function ctlFromDefaults() { const d = ctlDefaults(), b = {}; CTL_KEYS.forEach(k => { b[k] = { x: d[k].x, y: d[k].y, s: 1 }; }); return { v: 1, b, a: 1 }; }
  function openCtlEdit() {

    const d = ctlFromDefaults(), same = (ctl.a ?? 1) === 1 && CTL_KEYS.every(k => Math.abs(ctl.b[k].x - d.b[k].x) < 0.005 && Math.abs(ctl.b[k].y - d.b[k].y) < 0.005 && ctl.b[k].s === 1);

  $('cbSize').addEventListener('input', e => { ctl.b[ctlSel].s = +e.target.value / 100; applyCtl(); ctlSyncBar(); });
  $('cbAlpha').addEventListener('input', e => { ctl.a = +e.target.value / 100; applyCtl(); ctlSyncBar(); });
  // 拖曳：在最前面攔截，不讓比賽的按鍵功能收到
  let drag = null;

  // 更新公告：玩過的人回來時看一次；卡在第 2 關的人直接給「再挑戰」按鈕

  // 畫面：發球機＋黃圈站位
  function drawDrill(t) {
    const dd = G_.drill, fx = px(G_.a.x), fy = py(0);
    if (dd.id !== 'move') { // 發球機：箱子＋出球管
      const top = py(dd.d.feed.from[1]), w = 0.5 * S_;
      ctx.fillStyle = '#c9d4e8'; ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2;
      ctx.fillRect(fx - w / 2, top + 4, w, fy - top - 4); ctx.strokeRect(fx - w / 2, top + 4, w, fy - top - 4);
      ctx.fillStyle = '#ffe066'; ctx.fillRect(fx - w / 2, top + 4, w, 6);
      ctx.strokeStyle = '#e8eef8'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(fx, top + 8); ctx.lineTo(fx - w * 0.7, top - w * 0.35); ctx.stroke(); ctx.lineCap = 'butt';
      ctx.fillStyle = 'rgba(20,30,48,.8)'; ctx.font = `700 ${Math.max(9, 0.12 * S_)}px "Noto Sans TC", sans-serif`; ctx.textAlign = 'center';
      ctx.fillText(T().dr.feeder, fx, top + (fy - top) / 2 + 6); ctx.textAlign = 'left';
    }
    if (dd.phase === 'fly' && G_.b && G_.b.last === 'p') return;
    const a = 0.55 + 0.35 * Math.sin(t * 6), cx = px(dd.stand);
    ctx.strokeStyle = `rgba(255,224,102,${a})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.ellipse(cx, fy, 0.45 * S_, 0.12 * S_, 0, 0, 7); ctx.stroke();
    const gr = ctx.createLinearGradient(0, fy, 0, py(2.2)); gr.addColorStop(0, `rgba(255,224,102,${a * 0.35})`); gr.addColorStop(1, 'rgba(255,224,102,0)');
    ctx.fillStyle = gr; ctx.fillRect(cx - 0.4 * S_, py(2.2), 0.8 * S_, fy - py(2.2)); // 光柱：站位被按鈕擋住也看得到
  }

  // ---------- 戰術教學 ----------
  const TIPS = new Proxy({}, { get: (_, k) => T().tips[k] });
  let coachTimer = null;
  // 手機：把教練提示放在左右按鍵中間的空隙；空隙太窄就放到比分下方，避免擋到按鍵
  function placeCoach() {
    const c = $('coach'), st = c.style;
    st.left = st.top = st.bottom = st.maxWidth = '';
    if (!document.body.classList.contains('compact')) return;
    const l = document.querySelector('.ctrl.l').getBoundingClientRect(), r = document.querySelector('.ctrl.r').getBoundingClientRect();

  const KB_SWAP = [['▶', 'D'], ['「揮拍」', ' J '], ['「輕」', ' K '], ['＋揮拍', '＋J'], ['按揮拍', '按 J'], ['“Hit”', 'J'], ['“Soft”', 'K'], ['+ Hit', '+ J'], ['Use Soft', 'Use K']];
  const kbText = t => isTouch || typeof t !== 'string' ? t : KB_SWAP.reduce((x, [f, r]) => x.split(f).join(r), t);

  function coachAfterPoint(w, cause) {
    if (G_ && G_.pvp) return; // 好友對戰不出教練提示
    const g = G_, c = g.coach;
    if (w === 'a' && g.as - g.ps >= 3 && !c.shown.beat) { c.shown.beat = 1; coachSay(T().beatTips[g.level], 5000); return; }
    // 第二關開始教一次假動作
    if (g.level >= 1 && !c.shown.feint && !g.usedFeint && g.ps + g.as === 3) { c.shown.feint = 1; coachSay(TIPS.feint, 5500); return; }
    if (cause === 'svline' || cause === 'rcvline') { coachSay(TIPS[cause]); return; } // 發球犯規馬上提醒
    if (w === 'p') {
      c.streak = 0;
      if (g.b && g.b.last === 'p' && (g.b.type === 'smash' || g.b.type === 'kill') && !c.shown.nice) { c.shown.nice = 1; coachSay(T().tips.nice, 3000); }
      return;
    }
    c.streak++; c.counts[cause] = (c.counts[cause] || 0) + 1;
    let tip = null;
    if (c.counts[cause] >= 2 && (c.shown[cause] || 0) < 2) { tip = cause; c.counts[cause] = 0; }
    else if ((c.streak >= 3 || (g.as >= 3 && g.ps === 0)) && (c.shown.attack || 0) < 2) { tip = 'attack'; c.streak = 0; }
    if (tip) { c.shown[tip] = (c.shown[tip] || 0) + 1; coachSay(TIPS[tip]); }
  }

  function scorePoint(w, clean, cause) {
    const g = G_, bb = g.b || {};
    g.state = 'point'; g.timer = 0;
    if (w === 'p') { g.ps++; g.stats.total++; if ((bb.type === 'smash' || bb.type === 'kill') && bb.last === 'p') g.stats.smash++; }
    else g.as++;
    g.stats.longest = Math.max(g.stats.longest, g.rally); if (g.rally > 0) g.stats.rallies.push(g.rally);
    const serviceOver = g.server !== w;
    g.server = w;
    // 裁判報分：發球方分數先報
    const sv = w === 'p' ? g.ps : g.as, rc = w === 'p' ? g.as : g.ps;
    const call = isGameOver(g.ps, g.as) ? T().callGame(Math.max(g.ps, g.as), Math.min(g.ps, g.as))
      : T().callScore(sv, rc, isGameOver(g.ps + 1, g.as) || isGameOver(g.ps, g.as + 1), serviceOver);
    clearTimeout(g.callTimer);
    g.callTimer = setTimeout(() => umpire(call), clean ? 250 : 750);
    if (w === 'a' && cause && cause !== 'serve') g.stats.lost[cause] = (g.stats.lost[cause] || 0) + 1; // 發球太短不記（教練提示照樣會講）
    coachAfterPoint(w, cause);
    pointSound(w === 'p');
    updScore();
  }

  function decidePoint(w, clean, cause) { if (G_.pvp && G_.pvp.ai && !G_.pvp.vsAi) G_.pvp.aiPts++; scorePoint(w, clean, cause); if (pvpRemote()) pvpSendPoint(w, clean, cause); }
  function afterPoint() {
    const g = G_;
    if (isGameOver(g.ps, g.as)) { if (g.pvp) pvpEnd(g.ps > g.as); else endMatch(g.ps > g.as); return; }

  // ---------- UI ----------
  let msgTimer = null;

  // ---------- 結算：比分、來回、技術數據 ----------
  const TECH_ORDER = ['smash', 'kill', 'drive', 'block', 'clear', 'flatClear', 'slice', 'push', 'lift', 'net', 'netUnder', 'defClear', 'dropUnder'];
  let lastResult = null;
  const fmtTime = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = String(s % 60).padStart(2, '0'); return h ? `${h}:${String(m).padStart(2, '0')}:${ss}` : `${m}:${ss}`; }; // 分:秒（整數），超過一小時 時:分:秒

  function maybeAskFeedback(won, matches, lv) {
    const today = new Date().toDateString();
    // 記錄連輸、遊玩天數（不管今天會不會問，都要記）
    let ls = {}; try { ls = JSON.parse(store.get('bd_loseRun', '{}')); } catch (e) {}

    let days = []; try { days = JSON.parse(store.get('bd_days', '[]')); } catch (e) {}
    if (!days.includes(today)) { days.push(today); store.set('bd_days', JSON.stringify(days.slice(-10))); }
    if (store.get('bd_rated', '') === '1' || store.get('bd_fbDay', '') === today) return false;
    let done = {}; try { done = JSON.parse(store.get('bd_fbDone', '{}')); } catch (e) {}
    const cands = [
      !won && ls.n >= 3 && 'stuck' + (lv + 1),
      won && lv === 9 && 'clear10',
      won && lv === 4 && 'clear5',
      days.length >= 3 && 'day3',
      won && 'win',
      matches === 3 && 'm3'
    ];
    const key = cands.find(k => k && !done[k]);
    if (!key) return false;
    done[key] = 1; store.set('bd_fbDone', JSON.stringify(done)); store.set('bd_fbDay', today);
    setTimeout(() => openFeedback(key), 1600);
    return true;
  }

      e.preventDefault(); btn.classList.add('on');

    };
    const up = e => { btn.classList.remove('on'); if (k === 'left' || k === 'right') keys[k] = false; };

  function drawCourt() {
    // 體育館背景
    const g = ctx.createLinearGradient(0, 0, 0, GY);
    g.addColorStop(0, '#2b3550'); g.addColorStop(1, '#3d4b6b');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, GY);
    // 燈
    for (let i = 0; i < 4; i++) {
      const lx = W * (0.15 + i * 0.233);
      const lg = ctx.createRadialGradient(lx, 0, 4, lx, 0, 120);
      lg.addColorStop(0, 'rgba(255,248,220,.35)'); lg.addColorStop(1, 'rgba(255,248,220,0)');
      ctx.fillStyle = lg; ctx.fillRect(lx - 120, 0, 240, 120);
      ctx.fillStyle = '#fff8dc'; ctx.fillRect(lx - 22, 6, 44, 6);
    }
    // 牆上布條
    if (H >= 560) {
    ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0, py(5.4) - 15, W, 30);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.font = `700 ${Math.max(11, S_ * 0.38)}px "Noto Sans TC", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(T().banner, W / 2, py(5.4));
    }
    // 地板
    const fg = ctx.createLinearGradient(0, GY, 0, H);
    fg.addColorStop(0, '#c98d4f'); fg.addColorStop(1, '#8f5f30');
    ctx.fillStyle = fg; ctx.fillRect(0, GY, W, H - GY);
    // 球場（綠色）
    ctx.fillStyle = '#2f8f68'; ctx.fillRect(px(0), GY, COURT * S_, 14);
    ctx.fillStyle = '#fff';
    [0, 0.76, NET_X - 1.98, NET_X + 1.98, COURT - 0.76, COURT].forEach(x => ctx.fillRect(px(x) - 1.5, GY, 3, 14));

    else if (g.state === 'serve') {
      const sv = g[g.server];
      drawShuttle({ x: sv.x + (g.server === 'p' ? 0.45 : -0.45), y: 1.0, vx: 0, vy: -1 });
    }
  }

  let last = performance.now();
  function loop(now) {
    if (G_ && G_.pvp && now - last > 2000) pvpAway(); // 手機切走回來（畫面停了很久）：要跟對方重新同步
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); camera(dt); draw(now / 1000, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
