<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1d2433">
<meta name="description" content="羽球單打對決小遊戲：平抽、殺球、假動作，挑戰三關對手！">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="羽球PK">
<title>羽球PK | Badminton PK</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1d2433; font-family: "Noto Sans TC", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; touch-action: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  .score { position: fixed; top: 12px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; background: rgba(10,16,28,.72); padding: 8px 18px; border-radius: 16px; pointer-events: none; box-shadow: 0 6px 20px rgba(0,0,0,.3); }
  .score .side { text-align: center; min-width: 74px; }
  .score .nm { font-size: 12px; opacity: .8; white-space: nowrap; }
  .score .pt { font-size: 32px; font-weight: 900; line-height: 1.1; }
  .score .vs { font-size: 12px; opacity: .6; text-align: center; }
  .p1 .pt { color: #5ce1c6; } .p2 .pt { color: #ffa45c; }
  .msg { position: fixed; top: 92px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900; text-shadow: 0 3px 12px rgba(0,0,0,.6); pointer-events: none; white-space: nowrap; transition: opacity .25s; }
  .hint { position: fixed; top: 128px; left: 50%; transform: translateX(-50%); font-size: 13px; opacity: .8; pointer-events: none; white-space: nowrap; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  /* MOBA 式配置：左手移動區、右手技能區，按鈕大、間距開，拇指自然落點 */
  .ctrl { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom)); }
  .ctrl button { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: rgba(20,30,48,.42); color: #fff; font: 900 16px "Noto Sans TC", sans-serif; backdrop-filter: blur(3px); touch-action: none; -webkit-user-select: none; padding: 0; }
  .ctrl button.on { background: rgba(255,255,255,.28); }
  /* 左手：◀ ▶ 在下，跳在正中間上方 */
  .ctrl.l { left: calc(26px + env(safe-area-inset-left)); width: 190px; height: 142px; }
  .ctrl.l .mv { width: 78px; height: 78px; bottom: 0; font-size: 22px; }
  .ctrl.l [data-k="left"] { left: 0; } .ctrl.l [data-k="right"] { right: 0; }
  .ctrl.l .jump { width: 68px; height: 68px; top: 0; left: 50%; margin-left: -34px; border-color: #ffe066; background: rgba(120,100,30,.4); }
  /* 右手：大顆揮拍在角落，輕在左上方呈弧形 */
  .ctrl.r { right: calc(26px + env(safe-area-inset-right)); width: 196px; height: 142px; }
  .ctrl.r .hit { width: 104px; height: 104px; right: 0; bottom: 0; border-color: #5ce1c6; border-width: 3px; background: rgba(40,120,105,.45); font-size: 20px; }
  .ctrl.r .soft { width: 72px; height: 72px; right: 118px; bottom: 44px; border-color: #bfe9ff; }
  .notouch .ctrl { display: none; }
  .notouch .tc, .touch .kb { display: none; }
  .ctrl.l { left: calc(14px + env(safe-area-inset-left)); } .ctrl.r { right: calc(14px + env(safe-area-inset-right)); }
  .ctrl { bottom: calc(14px + env(safe-area-inset-bottom)); }
  .rotate { position: fixed; inset: 0; z-index: 50; background: #1d2433; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; text-align: center; padding: 30px; }
  .rotate .phone { font-size: 56px; animation: tilt 1.6s ease-in-out infinite; }
  .rotate b { font-size: 22px; } .rotate span { font-size: 14px; opacity: .75; }
  @keyframes tilt { 0%, 20% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  .touch.portrait .rotate { display: flex; }

  /* 手機橫向精簡版 */
  .compact .score { top: 6px; padding: 4px 12px; gap: 10px; border-radius: 12px; }
  .compact .score .side { min-width: 56px; }
  .compact .score .nm { font-size: 10px; }
  .compact .score .pt { font-size: 20px; }
  .compact .score .vs { font-size: 10px; }
  .compact .topL { top: 6px; left: calc(8px + env(safe-area-inset-left)); }
  .compact .helpBtn { padding: 5px 10px; font-size: 12px; }
  .compact .msg { top: 58px; font-size: 17px; }
  .compact .hint { top: 82px; font-size: 12px; }
  .compact .zone { top: 6px; right: calc(8px + env(safe-area-inset-right)); font-size: 11px; padding: 4px 8px; max-width: 30vw; line-height: 1.45; }
  .compact .ctrl { bottom: calc(10px + env(safe-area-inset-bottom)); }
  .compact .ctrl.l { left: calc(22px + env(safe-area-inset-left)); width: 168px; height: 122px; }
  .compact .ctrl.l .mv { width: 68px; height: 68px; font-size: 19px; }
  .compact .ctrl.l .jump { width: 60px; height: 60px; margin-left: -30px; font-size: 15px; }
  .compact .ctrl.r { right: calc(22px + env(safe-area-inset-right)); width: 174px; height: 122px; }
  .compact .ctrl.r .hit { width: 90px; height: 90px; font-size: 18px; }
  .compact .ctrl.r .soft { width: 64px; height: 64px; right: 104px; bottom: 38px; font-size: 15px; }
  .compact .overlay { padding: 8px calc(8px + env(safe-area-inset-right)) 8px calc(8px + env(safe-area-inset-left)); }
  .compact .card { padding: 14px 16px; border-radius: 16px; max-height: 96vh; }
  .compact .card h1 { font-size: 24px; } .compact .card h2 { font-size: 19px; }
  .compact .card p { font-size: 12px; margin: 4px 0; }
  .compact .rules { font-size: 12px; line-height: 1.6; padding: 8px 10px; margin: 8px 0; }
  .compact .shots { font-size: 12px; } .compact .shots th, .compact .shots td { padding: 3px; }
  .compact .ladder { margin: 6px 0; } .compact .ladder span { font-size: 11px; padding: 3px 8px; }
  .compact input { padding: 8px; margin: 4px 0 6px; }
  .fsTip { font-size: 12px !important; opacity: .6 !important; }
  .compact .fsTip:not(.browserTip) { display: none; }
  .browserTip { font-size: 12px !important; color: #ffe066; opacity: .95 !important; }
  .note { font-size: 12px !important; opacity: .65 !important; margin: 6px 0 !important; }
  body:not(.inMatch) .topL, body:not(.inMatch) .ctrl, body:not(.inMatch) .zone, body:not(.inMatch) .score { visibility: hidden; }
  .compact .btn { padding: 10px; font-size: 15px; margin-top: 6px; }
  .compact .big { font-size: 34px; margin: 2px 0; }
  .compact .stats { margin: 4px 0; } .compact .stats b { font-size: 17px; }
  /* 左右兩欄：左邊標題和按鈕，右邊說明 */
  .card { position: relative; }
  .compact .langSw { position: absolute; top: 10px; left: 12px; margin: 0; z-index: 2; }
  .compact .langBtn { padding: 3px 10px; font-size: 11px; }
  .compact .card h1 { font-size: 21px; line-height: 1.2; margin-top: 18px; }
  .compact .menuLadder { margin: 4px 0; }
  .compact #menu .rules, .compact #help .rules { font-size: 11px; line-height: 1.5; }
  .compact #menu .shots, .compact #help .shots { font-size: 11px; }
  .compact #help .card.split > h2 { margin-top: 26px; }
  .compact .browserTip { margin: 4px 0 0 !important; }
  .compact .card.split { width: min(760px, 100%); display: grid; grid-template-columns: 1fr 1.35fr; grid-auto-rows: min-content; align-content: center; column-gap: 16px; align-items: center; text-align: center; }
  .compact .card.split > * { grid-column: 1; }
  .compact .card.split > .rules { grid-column: 2; grid-row: 1 / span 12; margin: 0; align-self: center; max-height: calc(92vh - 36px); overflow-y: auto; }
  .compact #over .card { width: min(560px, 100%); }
  .overlay { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(10,14,24,.6); backdrop-filter: blur(3px); padding: 18px; }
  .card { width: min(430px, 100%); background: #212b3d; border: 1px solid rgba(92,225,198,.35); border-radius: 22px; padding: 24px 22px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); max-height: 94vh; overflow-y: auto; }
  .card h1 { margin: 0 0 2px; font-size: 30px; font-weight: 900; background: linear-gradient(90deg,#5ce1c6,#ffe066); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .card h2 { margin: 0 0 6px; font-size: 24px; }
  .card p { margin: 6px 0; font-size: 14px; line-height: 1.6; opacity: .92; }
  .rules { text-align: left; background: rgba(255,255,255,.06); border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.8; margin: 12px 0; }
  .rules b { color: #5ce1c6; }
  kbd { background: rgba(255,255,255,.15); border-radius: 5px; padding: 0 5px; font-family: inherit; font-size: 12px; }
  .shots { width: 100%; border-collapse: collapse; margin: 6px 0; text-align: center; font-size: 13px; }
  .shots th, .shots td { border: 1px solid rgba(255,255,255,.15); padding: 5px 4px; }
  .shots th { color: #ffe066; font-weight: 700; } .shots td:first-child { color: #5ce1c6; font-weight: 700; }
  .shots small { opacity: .7; font-size: 11px; }
  .zone { position: fixed; top: 92px; right: 14px; font-size: 13px; background: rgba(10,16,28,.6); padding: 6px 10px; border-radius: 10px; pointer-events: none; line-height: 1.5; text-align: right; }
  .zone b { color: #5ce1c6; }
  .topL { position: fixed; top: 14px; left: calc(14px + env(safe-area-inset-left)); display: flex; gap: 6px; z-index: 5; }
  .helpBtn { padding: 8px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.4); background: rgba(10,16,28,.65); color: #fff; font: 700 14px "Noto Sans TC", sans-serif; cursor: pointer; z-index: 5; }
  .helpBtn:hover { border-color: #5ce1c6; }
  .coach { position: fixed; top: 150px; left: 50%; transform: translateX(-50%); width: auto; max-width: 82vw; white-space: nowrap; background: rgba(255,224,102,.95); color: #1d2433; font-size: 14px; font-weight: 700; line-height: 1.55; padding: 10px 14px; border-radius: 14px; box-shadow: 0 8px 24px rgba(0,0,0,.35); z-index: 8; cursor: pointer; }
  .coach small { display: block; font-weight: 400; opacity: .7; font-size: 11px; margin-top: 2px; }
  .compact .coach { top: auto; bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 12px; line-height: 1.45; padding: 7px 12px; max-width: calc(100vw - 440px); white-space: normal; text-align: center; }
  .langSw { display: flex; justify-content: center; gap: 6px; margin-bottom: 8px; }
  .langBtn { padding: 5px 14px; border-radius: 99px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font: 700 13px "Noto Sans TC", sans-serif; cursor: pointer; }
  .langBtn.on { background: #5ce1c6; color: #1d2433; border-color: #5ce1c6; }
  .ctrl button.cue { animation: cue .35s infinite alternate; border-color: #ffe066 !important; }
  @keyframes cue { to { box-shadow: 0 0 0 8px rgba(255,224,102,.35); background: rgba(255,224,102,.3); } }
  .feintCue { position: fixed; top: 118px; left: 50%; transform: translateX(-50%); background: rgba(255,224,102,.92); color: #1d2433; font-weight: 900; font-size: 13px; padding: 4px 12px; border-radius: 99px; pointer-events: none; z-index: 7; white-space: nowrap; }
  .compact .feintCue { top: 86px; font-size: 12px; }
  .linkBtn { display: block; margin: 10px auto 0; background: none; border: 0; color: rgba(255,255,255,.65); font: 13px "Noto Sans TC", sans-serif; text-decoration: underline; cursor: pointer; }
  .appIcon { width: 76px; height: 76px; border-radius: 18px; display: block; margin: 0 auto 6px; box-shadow: 0 6px 18px rgba(0,0,0,.4); }
  .card.home { width: min(460px, 100%); }
  .homeHi { font-size: 16px !important; color: #ffe066; font-weight: 700; }
  .btn.big2 { font-size: 19px; padding: 15px; }
  .stageSel { display: flex; gap: 6px; margin-top: 8px; }
  .stageSel button { flex: 1; padding: 8px 4px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(255,255,255,.07); color: #fff; font: 700 13px "Noto Sans TC", sans-serif; cursor: pointer; line-height: 1.35; }
  .stageSel button small { display: block; font-weight: 400; opacity: .7; font-size: 11px; }
  .stageSel button.done { border-color: #5ce1c6; }
  .stageSel button:disabled { opacity: .35; cursor: default; }
  .homeRow { display: flex; gap: 6px; } .homeRow .btn { font-size: 14px; padding: 10px 4px; }
  .recGrid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 12px 0; }
  .recGrid div { background: rgba(255,255,255,.06); border-radius: 12px; padding: 8px; font-size: 12px; opacity: .95; }
  .recGrid b { display: block; font-size: 22px; color: #5ce1c6; }
  .setRow { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-bottom: 1px solid rgba(255,255,255,.08); font-size: 14px; }
  .setRow .langSw { position: static !important; margin: 0; }
  .setRow input { width: 55%; margin: 0; padding: 7px 10px; font-size: 14px; }
  .toggle { min-width: 64px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.35); background: transparent; color: #fff; font: 700 13px "Noto Sans TC", sans-serif; cursor: pointer; }
  .toggle.on { background: #5ce1c6; color: #1d2433; border-color: #5ce1c6; }
  .techTitle { font-size: 12px; opacity: .7; margin-top: 4px; }
  .techList { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 6px 0 4px; }
  .techList span { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(92,225,198,.15); }
  .techList span b { color: #ffe066; margin-left: 4px; }
  .shareImg { width: min(300px, 70vw, 52vh); aspect-ratio: 1; border-radius: 12px; display: block; margin: 0 auto 8px; box-shadow: 0 8px 24px rgba(0,0,0,.4); }
  a.btn { text-decoration: none; box-sizing: border-box; }
  .compact .card.result { width: min(560px, 100%); }
  .compact .result .big { font-size: 30px; } .compact .result h2 { font-size: 17px; margin: 0; }
  .compact .card.home { padding: 12px 16px; } .compact .card.home h1 { margin-top: 0; }
  .compact #shareView .card { width: min(680px, 100%); display: grid; grid-template-columns: auto 1fr; column-gap: 18px; align-items: center; }
  .compact #shareView .card > * { grid-column: 2; }
  .compact #shareView .shareImg { grid-column: 1; grid-row: 1 / span 8; width: min(300px, 78vh); margin: 0; }
  .ladder { display: flex; justify-content: center; gap: 6px; margin: 10px 0; flex-wrap: wrap; }
  .ladder span { font-size: 12px; padding: 4px 10px; border-radius: 99px; background: rgba(255,255,255,.08); }
  .ladder span.done { background: rgba(92,225,198,.25); color: #5ce1c6; }
  .ladder span.cur { background: #ffa45c; color: #1d2433; font-weight: 700; }
  input { width: 100%; padding: 11px 14px; border-radius: 12px; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; font: 16px "Noto Sans TC", sans-serif; text-align: center; margin: 6px 0 10px; outline: none; }
  .btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: 14px; font: 900 17px "Noto Sans TC", sans-serif; cursor: pointer; margin-top: 8px; }
  .btn.pri { background: linear-gradient(90deg,#5ce1c6,#ffe066); color: #1d2433; }
  .btn.sec { background: rgba(255,255,255,.12); color: #fff; }
  .big { font-size: 46px; font-weight: 900; margin: 6px 0; }
  .stats { display: flex; justify-content: center; gap: 18px; font-size: 13px; opacity: .9; margin: 8px 0; }
  .stats b { display: block; font-size: 20px; }
  .toast { font-size: 13px; color: #5ce1c6; min-height: 20px; margin-top: 6px; }
  textarea.copybox { width: 100%; height: 70px; margin-top: 8px; border-radius: 10px; background: rgba(0,0,0,.25); color: #fff; border: 1px solid rgba(255,255,255,.2); font: 13px "Noto Sans TC", sans-serif; padding: 8px; resize: none; }
  .hidden { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="score">
  <div class="side p1"><div class="nm" id="pName"></div><div class="pt" id="pScore">0</div></div>
  <div class="vs"><span id="lvLbl"></span><br><span id="ruleLbl"></span></div>
  <div class="side p2"><div class="nm" id="aName"></div><div class="pt" id="aScore">0</div></div>
</div>
<div class="msg" id="msg"></div>
<div class="hint" id="hint"></div>
<div class="coach hidden" id="coach"></div>
<div class="feintCue hidden" id="feintCue"></div>
<div class="zone hidden" id="zone"></div>
<!-- 安裝畫面：手機用瀏覽器開啟時先出現（可以略過） -->
<div class="overlay hidden" id="gate" style="z-index:60">
  <div class="card">
    <img class="appIcon" src="icon-192.png" alt="" onerror="this.style.display='none'">
    <h1 data-t="gameName"></h1>
    <p data-t="gateP"></p>
    <div class="rules" id="gateSteps"></div>
    <button class="btn pri" id="gateBtn"></button>
    <textarea class="copybox hidden" id="urlBox" readonly></textarea>
    <div class="toast" id="urlToast"></div>
    <button class="linkBtn" id="gateSkip" data-t="gateSkip"></button>
  </div>
</div>
<div class="rotate" id="rotate"><div class="phone">📱</div><b data-t="rotateB"></b><span data-t="rotateS"></span><button class="btn pri hidden" id="fsRotate" style="width:auto;padding:12px 26px" data-t="fsRotate"></button></div>
<!-- 比賽中左上角：暫停、全螢幕 -->
<div class="topL"><button class="helpBtn" id="pauseBtn" data-t="pauseBtn"></button><button class="helpBtn hidden" id="fsBtn"></button></div>

<div class="overlay hidden" id="help" style="z-index:40">
  <div class="card split">
    <div class="langSw"><button class="langBtn" data-lang="zh">中文</button><button class="langBtn" data-lang="en">English</button></div>
    <h2 data-t="helpTitle"></h2>
    <div class="rules" data-rules></div>
    <button class="btn pri" id="helpClose"></button>
  </div>
</div>

<div class="ctrl l"><button data-k="jump" class="jump" data-t="btnJump"></button><button data-k="left" class="mv">◀</button><button data-k="right" class="mv">▶</button></div>
<div class="ctrl r"><button data-k="drop" class="soft" data-t="btnSoft"></button><button data-k="swing" class="hit" data-t="btnSwing"></button></div>

<!-- 第一次進來：取名字＋玩法介紹 -->
<div class="overlay hidden" id="menu">
  <div class="card split">
    <div class="langSw"><button class="langBtn" data-lang="zh">中文</button><button class="langBtn" data-lang="en">English</button></div>
    <h1 data-t="gameName"></h1>
    <p data-t="sub"></p>
    <div class="ladder menuLadder"></div>
    <div class="rules" data-rules></div>
    <input id="nameIn" maxlength="12">
    <button class="btn pri" id="startBtn" data-t="welcomeStart"></button>
  </div>
</div>

<!-- 主頁面 -->
<div class="overlay hidden" id="home">
  <div class="card home">
    <h1 data-t="gameName"></h1>
    <p class="homeHi" id="homeHi"></p>
    <button class="btn pri big2" id="contBtn"></button>
    <div class="stageSel" id="stageSel"></div>
    <div class="homeRow">
      <button class="btn sec" id="recBtn" data-t="recordsBtn"></button>
      <button class="btn sec" id="setBtn" data-t="settingsBtn"></button>
      <button class="btn sec" id="homeHelpBtn" data-t="helpHome"></button>
    </div>
    <button class="btn sec hidden" id="homeInstall" data-t="installHome"></button>
    <button class="linkBtn" id="exitBtn" data-t="exitGame"></button>
  </div>
</div>

<!-- 個人紀錄 -->
<div class="overlay hidden" id="records" style="z-index:30">
  <div class="card">
    <h2 data-t="recordsTitle"></h2>
    <div class="recGrid" id="recGrid"></div>
    <button class="btn pri" id="recClose" data-t="back"></button>
  </div>
</div>

<!-- 設定 -->
<div class="overlay hidden" id="settings" style="z-index:30">
  <div class="card">
    <h2 data-t="settingsTitle"></h2>
    <div class="setRow"><span data-t="setLang"></span><div class="langSw"><button class="langBtn" data-lang="zh">中文</button><button class="langBtn" data-lang="en">English</button></div></div>
    <div class="setRow"><span data-t="setVoice"></span><button class="toggle" id="voiceTog"></button></div>
    <div class="setRow"><span data-t="setSound"></span><button class="toggle" id="soundTog"></button></div>
    <div class="setRow"><span data-t="setName"></span><input id="renameIn" maxlength="12"></div>
    <button class="btn pri" id="setClose" data-t="saveBack"></button>
  </div>
</div>

<!-- 暫停 -->
<div class="overlay hidden" id="pause" style="z-index:30">
  <div class="card">
    <h2 data-t="pauseTitle"></h2>
    <button class="btn pri" id="resumeBtn" data-t="resume"></button>
    <button class="btn sec" id="pHelp" data-t="helpHome"></button>
    <button class="btn sec" id="pSet" data-t="settingsBtn"></button>
    <button class="btn sec" id="pRestart" data-t="restart"></button>
    <button class="btn sec" id="pHome" data-t="toHome"></button>
    <button class="linkBtn" id="pExit" data-t="exitGame"></button>
  </div>
</div>

<!-- 結算 -->
<div class="overlay hidden" id="over">
  <div class="card result">
    <h2 id="ovTitle"></h2>
    <div class="big" id="ovScore"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const cv = $('c'), ctx = cv.getContext('2d');
  const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  document.body.classList.add(isTouch ? 'touch' : 'notouch');

  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  // ---------- 場地與尺寸（公尺） ----------
  const COURT = 13.4, NET_X = 6.7, NET_H = 1.55;
  const G = 9.8, K = 0.17; // 羽球空氣阻力
  let W, H, DPR, S_, OX, GY;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = W * DPR; cv.height = H * DPR; ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const compact = isTouch && H < 560 && W > H;
    document.body.classList.toggle('compact', compact);
    document.body.classList.toggle('portrait', isTouch && H > W);

    TOP = compact ? 30 : 70;

    MINSPAN = compact ? 3.6 : 6.6;

    layout();
  }
  let TOP = 70, MINSPAN = 6.6, span = 0;
  function layout() {
    S_ = Math.min(W / 15.2, (GY - TOP) / span);
    OX = (W - COURT * S_) / 2;
  }
  function camera(dt) {
    let want = MINSPAN;
    const g = G_;
    if (g && g.b) want = Math.max(want, Math.min(7.5, g.b.y + 1.1));
    if (g) want = Math.max(want, 2.3 + Math.max(g.p.y, g.a.y) + 0.6);
    span += (want - span) * Math.min(1, dt * (want > span ? 4 : 1.6));
    layout();
  }

  const px = x => OX + x * S_, py = y => GY - y * S_;

  // ---------- 音效：用雜訊合成羽球擊球聲 ----------
  let ac = null, noiseBuf = null;
  function audio() {
    if (typeof soundOn !== 'undefined' && !soundOn) return null;
    try {
      if (!ac) {
        ac = new (window.AudioContext || window.webkitAudioContext)();
        noiseBuf = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
        const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      }
      if (ac.state === 'suspended') ac.resume();
      return ac;
    } catch (e) { return null; }
  }
  // 一段經過濾波的雜訊：type 濾波種類、f 頻率、q、dur 長度、vol 音量、delay 延遲
  function burst(type, f, q, dur, vol, delay = 0, f2) {
    const A = audio(); if (!A) return;
    const t0 = A.currentTime + delay, src = A.createBufferSource(), fl = A.createBiquadFilter(), g = A.createGain();
    src.buffer = noiseBuf; fl.type = type; fl.frequency.setValueAtTime(f, t0); fl.Q.value = q;
    if (f2) fl.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.002); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    src.connect(fl); fl.connect(g); g.connect(A.destination); src.start(t0); src.stop(t0 + dur + 0.02);
  }
  function tone(type, f, f2, dur, vol, delay = 0) {
    const A = audio(); if (!A) return;
    const t0 = A.currentTime + delay, o = A.createOscillator(), g = A.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t0); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0); g.gain.exponentialRampToValueAtTime(vol, t0 + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(A.destination); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function hitSound(kind) {
    try {
      if (kind === 'smash' || kind === 'kill') {        // 殺球：又脆又重的「啪！」＋低頻衝擊
        burst('highpass', 4500, 0.7, 0.025, 0.5);
        burst('bandpass', 1700, 0.8, 0.07, 1.0);
        tone('triangle', 160, 60, 0.09, 0.55);
        tone('sine', 1250, 900, 0.06, 0.07);

        burst('bandpass', 4600, 2.0, 0.018, 0.22);
        tone('sine', 2100, 1900, 0.03, 0.03);
      } else if (kind === 'slice') {                      // 切球：擦拍的「嘶」
        burst('bandpass', 3400, 1.2, 0.035, 0.38);
        burst('highpass', 6000, 0.5, 0.05, 0.12, 0.005);
      } else if (kind === 'serve') {                      // 反手發小球：輕推

      }

  function step(b, dt) {
    const v = Math.hypot(b.vx, b.vy);

    b.vy += (-G - K * v * b.vy) * dt;

    let lo = 2, hi = 70;
    for (let i = 0; i < 26; i++) {
      const m = (lo + hi) / 2, r = sim(x, y, dir * m * Math.cos(a), m * Math.sin(a));
      if ((r.land - tx) * dir < 0) lo = m; else hi = m;
    }
    const sp = (lo + hi) / 2;
    return { vx: dir * sp * Math.cos(a), vy: sp * Math.sin(a) };
  }

  function solveAngle(x, y, tx, sp) {
    const dir = Math.sign(tx - x) || 1;
    let lo = -70, hi = 15;
    for (let i = 0; i < 26; i++) {
      const m = (lo + hi) / 2, a = m * Math.PI / 180, r = sim(x, y, dir * sp * Math.cos(a), sp * Math.sin(a));
      if ((r.land - tx) * dir < 0) lo = m; else hi = m;
    }

    return { vx: dir * sp * Math.cos(a), vy: sp * Math.sin(a) };
  }
  function shot(x, y, tx, type, air) {

      const spd = type === 'kill' ? 22 : air ? 29 : 25; // 跳殺比原地殺球快
      for (let k = 0; k < 4; k++) {
        const t = tx + Math.sign(tx - x) * k * 0.9, v = solveAngle(x, y, t, spd);
        const r = sim(x, y, v.vx, v.vy);
        if (r.netY > NET_H + 0.12) return v;
      }
      return solveSpeed(x, y, tx, 10);
    }

      net: [10, 18, 26, 36, 46, 56, 64, 72, 78],      // 放網：貼網過
      netUnder: [14, 20, 26, 32, 40, 48, 56, 64, 72, 78], // 下手放網：從下往上托，越貼網越好

      serve: [14, 20, 26, 32],        // 反手發小球
      push: [4, 0, 9, 14, 20, 26, 32],        // 推球：平快壓後場
      lift: [52, 46, 60, 66, 72],     // 挑球：又高又深
      clear: [42, 36, 50, 58],        // 高遠球
      slice: [-4, 2, 8, 14, 22, 30, 38],      // 切球：快速落前中場
      drive: [3, -2, 7, 11, 15, 20],          // 平抽：又平又快
      block: [4, 8, 12, 17, 23, 30, 38],      // 平擋：放慢節奏落前中場
      flatClear: [28, 24, 32, 36, 40]         // 平高球：比高遠球低、快
    };
    const margin = ['net', 'netUnder', 'dropUnder', 'serve', 'block'].includes(type) ? 0.07 : type === 'drive' ? 0.1 : 0.15;
    let v;
    for (const a of (ANG[type] || ANG.clear)) {
      v = solveSpeed(x, y, tx, a);
      if (sim(x, y, v.vx, v.vy).netY > NET_H + margin) return v;
    }
    return v;
  }

  function doServe(who) {
    const g = G_, pl = g[who], rcv = who === 'p' ? g.a : g.p;
    if (overLine(pl) || overLine(rcv)) { // 誰越線誰犯規
      const bad = overLine(pl) ? who : (who === 'p' ? 'a' : 'p');
      g.b = null; pl.swingType = 'serve'; pl.swingT = contactT('serve');
      showMsg(bad === who ? T().svFault : T().rcvFault, '#ff8a8a', 1400); netSound();
      $('hint').textContent = '';
      scorePoint(bad === 'p' ? 'a' : 'p', false, bad === who ? 'svline' : 'rcvline');
      return;
    }
    const fx = pl.x + (who === 'p' ? 0.45 : -0.45), fy = 1.0;
    g.aiRoll = Math.random(); g.aiJumped = false;
    // 反手發小球：剛好過前發球線
    const d = NET_X + 2.05 + Math.random() * 0.6;
    const tx = who === 'p' ? d : COURT - d;
    const v = shot(fx, fy, tx, 'serve');
    g.b = { x: fx, y: fy, vx: v.vx, vy: v.vy, last: who, net: false, type: 'serve' };
    pl.swingType = 'serve'; pl.swingT = contactT('serve');
    showMsg(who === 'p' ? T().shots.serve : T().opp(T().shots.serve), '#bfe9ff');
    g.state = 'rally'; $('hint').textContent = '';
    g.aiDelay = LEVELS[g.level].react; g.aiPlan = null;
    hitSound('serve');
  }

  // ---------- 擊球 ----------
  function reach(pl) { return 2.35 + pl.y; }
  function inZone(pl, b) {
    const dx = (b.x - pl.x) * (pl.side === 'p' ? 1 : -1);
    return dx > -0.65 && dx < 1.05 && b.y > 0.12 && b.y < reach(pl) &&
      (pl.side === 'p' ? b.x < NET_X : b.x > NET_X) && b.last !== pl.side;
  }

  // 站位分區：離網 2.4 公尺內＝前場、2.4～4.6＝中場、更遠＝後場
  function zoneOf(pl) { const d = Math.abs(pl.x - NET_X); return d < 2.4 ? 'front' : d < 4.6 ? 'mid' : 'back'; }
  function isFront(pl) { return zoneOf(pl) === 'front'; }

  // soft＝「輕」、fwd＝按住往網前（▶）。主動球從上面打，被動球自動改成下手
  function chooseKind(pl, b, soft, fwd) {
    const z = zoneOf(pl), h = b.y, air = pl.y > 0.2;
    if (z === 'front') {
      if (soft) return h >= 1.1 ? 'net' : 'netUnder';
      if (h > 1.9 && (air || fwd)) return 'kill';           // 網前往前壓或跳起來＝撲球
      return h > 1.3 ? 'push' : 'lift';
    }
    if (air && h > 2.0) return soft ? 'slice' : fwd ? 'smash' : 'flatClear'; // 跳起來：平高球；加往前＝跳殺
    const high = z === 'mid' ? h > 1.9 : h >= 1.7;
    if (high) return soft ? 'slice' : fwd ? 'smash' : 'clear';               // 往前＋揮拍＝原地殺球
    if (z === 'mid' && h >= 1.0) return soft ? 'block' : 'drive';            // 中場胸前球：快抽／平擋
    return soft ? 'dropUnder' : 'defClear';
  }
  // 以擊球者的方向來看的落點（對面場地 6.7～13.4）
  function targetFor(kind, opp, who, style) {
    const r = Math.random();
    const oppFront = who === 'p' ? opp.x < NET_X + 2.6 : opp.x > NET_X - 2.6;
    if (style === 'rookie') { // 學弟：高球只打到半場，網前也不夠貼
      if (['clear', 'lift', 'defClear', 'push', 'drive', 'flatClear'].includes(kind)) return 9.7 + r * 1.5;
      if (kind === 'smash') return 9.5 + r * 2;
      return NET_X + 0.9 + r * 1.2;
    }
    if (style === 'ace') { // 王牌：四角精準
      switch (kind) {
        case 'net': case 'netUnder': return NET_X + 0.3 + r * 0.45;
        case 'dropUnder': case 'slice': return NET_X + 0.6 + r * 0.8;
        case 'clear': case 'lift': case 'defClear': case 'push': return 12.5 + r * 0.75;
        case 'smash': return oppFront ? 11.6 + r * 1.4 : 8.0 + r * 1.2;
        case 'kill': return NET_X + 1.0 + r * 1.6;
        case 'drive': return 11.2 + r * 1.4;
        case 'block': return NET_X + 0.8 + r * 0.8;
        case 'flatClear': return 12.6 + r * 0.6;
      }
    }
    switch (kind) {
      case 'net': case 'netUnder': return NET_X + 0.35 + r * 0.9;
      case 'dropUnder': return NET_X + 0.5 + r * 1.1;
      case 'defClear': return 11.9 + r * 1.2;
      case 'push': return 10.9 + r * 1.9;
      case 'lift': case 'clear': return 11.8 + r * 1.35;
      case 'slice': return NET_X + 1.1 + r * 1.3;
      case 'smash': return oppFront ? 10.6 + r * 2.2 : 8.4 + r * 2.4;
      case 'kill': return NET_X + 1.2 + r * 2.0;
      case 'drive': return 10.2 + r * 2.0;
      case 'block': return NET_X + 1.0 + r * 1.3;
      case 'flatClear': return 12.2 + r * 0.9;
    }
    return 11;
  }

  // 對手選球：看自己的位置、球的高度、你站哪裡；回傳 { kind, fake }
  function aiChoose(a, b, L, p) {
    const g = G_, z = zoneOf(a), h = b.y, air = a.y > 0.2, R = Math.random();
    let attack, soft;
    if (z === 'front') {
      if (h > 2.0 && b.vy <= 0.5 && (air || Math.random() < L.killP)) return { kind: 'kill' }; // 只撲往下掉或平飛的球
      attack = h > 1.3 ? 'push' : 'lift'; soft = h >= 1.1 ? 'net' : 'netUnder';
    } else if (air && h > 2.0) {
      return { kind: g.aiRoll < L.smashP ? 'smash' : 'flatClear' };
    } else {
      const high = z === 'mid' ? h > 1.9 : h >= 1.7;
      if (high) { attack = Math.random() < L.smashP * 0.45 ? 'smash' : 'clear'; soft = 'slice'; }
      else if (z === 'mid' && h >= 1.0) { attack = 'drive'; soft = 'block'; }
      else { attack = 'defClear'; soft = 'dropUnder'; }
    }
    if (L.style === 'rookie') { // 學弟：不會平抽、不會殺，大多把球打高
      if (R < 0.82) return { kind: z === 'front' ? 'lift' : (attack === 'drive' ? 'defClear' : attack === 'smash' ? 'clear' : attack) };
      return { kind: soft };
    }
    let kind;
    if (attack === 'drive') kind = R < L.driveP ? 'drive' : R < L.driveP + L.blockP ? 'block' : (p.x < 3.4 ? 'block' : 'defClear');
    else {
      const pBack = p.x < 3.4, pFront = p.x > 4.4;
      if (R < L.exploit && pBack) kind = soft;            // 你在後場 → 吊網前
      else if (R < L.exploit && pFront) kind = attack;    // 你在網前 → 打後場
      else kind = Math.random() < 0.5 ? attack : soft;
    }
    // 假動作：同一個架拍，打出相反的球
    let fake = null;
    if (Math.random() < L.feintP) {
      if (['slice', 'net', 'dropUnder', 'block'].includes(kind)) fake = z === 'front' ? 'push' : (kind === 'block' ? 'drive' : 'clear');
      else if (['push', 'lift'].includes(kind) && z === 'front') fake = 'net';
    }
    return { kind, fake };
  }
  const KIND_RISK = { drive: 1.6, smash: 1.4, kill: 1.3, net: 1.3, block: 1.2, flatClear: 1.2 };
  const FAST = ['drive', 'smash', 'kill', 'flatClear', 'push'];
  const SHORT = ['net', 'netUnder', 'dropUnder', 'slice', 'block'];
  const DEEP = ['clear', 'flatClear', 'lift', 'defClear', 'push', 'drive'];

  function hit(who, soft, opt = {}) {
    const g = G_, pl = g[who], b = g.b, L = LEVELS[g.level];
    const opp = who === 'p' ? g.a : g.p;
    const dec = who === 'a' ? (opt.decision || aiChoose(pl, b, L, opp)) : { kind: chooseKind(pl, b, soft, opt.fwd), fake: opt.feint ? (opt.fakeKind || 'clear') : null };
    const kind = dec.kind, feint = !!dec.fake;
    let t = targetFor(kind, opp, who, who === 'a' ? L.style : null);
    if (who === 'p' && DEEP.includes(kind)) {
      // 理想擊球點在身體前方約 0.35 公尺；越前面（越早出手）力道越大、越容易出界
      const dx = (b.x - pl.x) * (pl.side === 'p' ? 1 : -1);
      t = Math.min(t, 12.9) + (dx - 0.35) * 1.5 + (pl.y > 0.2 ? 0.25 : 0) + (Math.random() - 0.5) * 0.7;
      if (zoneOf(pl) === 'front' && kind !== 'push') t += 0.35; // 網前挑球離底線近，更容易挑出界
    }
    if (who === 'a') { // 對手失誤：難的球路、或接你的快球時比較容易失誤
      const pf = L.fault * (KIND_RISK[kind] || 1) + (FAST.includes(b.type) ? L.pressFault : 0);
      if (Math.random() < pf) t = Math.random() < .5 ? COURT + 0.5 + Math.random() * 0.8 : NET_X - 0.5;
    }
    // 你的假動作：對手先往反方向跑（王牌有機會看穿）
    let fooled = false;
    if (who === 'p') { g.stats.shots[kind] = (g.stats.shots[kind] || 0) + 1; if (feint) { g.usedFeint = true; g.stats.feints++; } }
    if (who === 'p' && feint && Math.random() >= L.readP) { fooled = true; g.stats.fooled++; g.aiFeintT = L.feintRead; g.aiFeintDir = SHORT.includes(kind) ? 1 : -1; }
    else if (who === 'p') g.aiFeintT = 0;
    if (who === 'p') { g.aiRoll = Math.random(); g.aiJumped = false; if (L.style === 'ace' && g.a.y === 0) g.a.vy = 1.5; } // 王牌：你擊球時啟動步
    const tx = who === 'p' ? t : COURT - t;
    const v = shot(b.x, b.y, tx, kind, pl.y > 0.2);
    b.vx = v.vx; b.vy = v.vy; b.last = who; b.type = kind; b.net = false;
    pl.swingType = kind; pl.swingT = contactT(kind);
    g.rally++;
    g.aiDelay = who === 'p' ? L.react : 0; g.aiPlan = null;
    const mine = who === 'p';
    const nm = T().shots[kind];
    const label = feint ? (mine ? '' : T().opp('')) + T().feintName(dec.fake, kind) + (mine && fooled ? T().fooled : '') : (mine ? nm : T().opp(nm));
    showMsg(label, (kind === 'smash' || kind === 'kill') ? (mine ? '#ffe066' : '#ff8a8a') : mine ? '#bfe9ff' : '#ffd0b0');
    hitSound(kind);
  }

  // ---------- AI ----------
  function aiThink(dt) {
    const g = G_, a = g.a, b = g.b, L = LEVELS[g.level];
    let target = a.x, sp = L.speed;
    const wantJump = L.smashP > 0 && g.aiRoll < L.smashP;
    if (b && g.state === 'rally' && b.last === 'p') {
      if (g.aiDelay > 0) g.aiDelay -= dt;
      else {
        g.aiRetarget -= dt;
        if (!g.aiPlan || g.aiRetarget <= 0) {
          g.aiRetarget = 0.1;
          // 預測球掉到可以打的高度在哪；要跳殺就在比較高的位置攔
          const s = { x: b.x, y: b.y, vx: b.vx, vy: b.vy }; let ix = null;
          const catchH = wantJump ? 2.8 : 2.1;
          for (let i = 0; i < 1600 && s.y > 0; i++) {
            step(s, 1 / 120);
            if (s.vy < 0 && s.x > NET_X && s.y < catchH && ix === null) ix = s.x;
          }
          if (ix === null) ix = s.x;
          g.aiPlan = { x: ix + 0.35 };
        }
        target = g.aiPlan.x;
      }
    } else if (g.state === 'rally' && b && b.last === 'a') {
      // 打完回中場：學弟不回位、隊長慢慢回、王牌馬上回
      if (L.recover > 0) { target = 9.8; sp *= L.recover; }
    }
    // 被你的假動作騙：先往反方向跑一下
    if (g.aiFeintT > 0 && b && b.last === 'p') { g.aiFeintT -= dt; target = a.x + g.aiFeintDir * 3; }
    const d = target - a.x;
    a.x += Math.max(-sp * dt, Math.min(sp * dt, d));
    a.x = Math.max(NET_X + 0.35, Math.min(COURT - 0.2, a.x));

    if (b && g.state === 'rally' && b.last === 'p') {
      const near = Math.abs(b.x - a.x) < 1.2 && b.x > NET_X && b.vy < 0;
      if (a.y === 0 && !g.aiJumped && near) {
        if (!isFront(a) && wantJump && b.y > 2.4 && b.y < 3.4) { a.vy = 4.2; g.aiJumped = true; }            // 後場跳殺
        else if (isFront(a) && L.killP > 0 && g.aiRoll < L.killP && b.y > 1.9 && b.y < 2.7) { a.vy = 3.6; g.aiJumped = true; } // 網前撲球
      }
      // 對手的假動作：先做另一種球的動作，停一下才真正出手
      if (g.aiPend) { g.aiPend.t -= dt; if (g.aiPend.t <= 0) { const d = g.aiPend.d; g.aiPend = null; hit('a', false, { decision: d }); } }
      else if (inZone(a, b)) {
        const d = aiChoose(a, b, L, g.p);
        if (d.fake) { a.swingType = d.fake; a.swingT = 0; g.aiPend = { t: 0.14, d }; }
        else hit('a', false, { decision: d });
      }
    }
  }

  // ---------- 主更新 ----------
  function updPlayer(pl, dt) {
    if (pl.y > 0 || pl.vy > 0) { pl.vy -= 13 * dt; pl.y += pl.vy * dt; if (pl.y <= 0) { pl.y = 0; pl.vy = 0; } }
    if (pl.swingT >= 0) { pl.swingT += dt; if (pl.swingT > ((SWINGS[pl.swingType] || SWINGS.clear).dur)) pl.swingT = -1; }
    pl.cool = Math.max(0, pl.cool - dt);
  }

  let pendingSwing = null, pendingT = 0, pendingFeint = false, pendingFwd = false, pendingFake = null;
  function playerSwing(type) {
    if (!G_ || G_.over || paused || readyT > 0) return;
    const g = G_, p = g.p;
    if (g.state === 'serve' && g.server === 'p') { doServe('p'); return; }
    // 假動作：剛按了一顆，0.25 秒內改按另一顆 → 做了前一種的動作，打出後一種球
    if (pendingSwing && pendingSwing !== type && !pendingFeint) {
      const fakeKind = p.swingType; // 剛剛做出來的動作
      pendingSwing = type; pendingFeint = true; pendingFake = fakeKind; pendingT = Math.max(pendingT, 0.25);
      if (g.b && inZone(p, g.b)) { const f = pendingFwd || keys.right; pendingSwing = null; pendingFeint = false; hit('p', type === 'drop', { fwd: f, feint: true, fakeKind }); }
      return;
    }
    if (p.cool > 0) return;
    p.cool = 0.3;
    const soft = type === 'drop';
    // 按下就立刻判定，球已經在拍子範圍就馬上擊出（這時來不及做假動作）
    if (g.b && g.state === 'rally' && inZone(p, g.b)) { hit('p', soft, { fwd: keys.right }); return; }
    p.swingT = 0; p.swingType = g.b ? chooseKind(p, g.b, soft, keys.right) : 'clear';
    swishSound(p.swingType === 'smash' || p.swingType === 'kill');
    pendingSwing = type; pendingT = 0.4; pendingFeint = false; pendingFwd = keys.right; // 早按一點也沒關係，球一進範圍就擊出
  }
  function playerJump() { if (paused || readyT > 0) return; const p = G_ && G_.p; if (p && p.y === 0) p.vy = 4.3; }

  // ---------- 全螢幕（Android Chrome 等支援的瀏覽器） ----------
  const fsOK = !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
  const isFull = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  async function goFull() {
    if (!fsOK || isFull()) return;
    try {
      const el = document.documentElement;
      await (el.requestFullscreen ? el.requestFullscreen({ navigationUI: 'hide' }) : el.webkitRequestFullscreen());
      try { await screen.orientation.lock('landscape'); } catch (e) {}
    } catch (e) {}
  }
  function toggleFull() {
    if (isFull()) { try { (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch (e) {} }
    else goFull();
  }
  function updFsBtn() { $('fsBtn').textContent = isFull() ? T().fsOff : T().fsOn; }
  const isIOS = /iPhone|iPod/.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1 && !fsOK);
  // 已經從主畫面全螢幕打開就不用全螢幕按鈕
  const appMode = window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (fsOK && !appMode) { $('fsBtn').classList.remove('hidden'); $('fsRotate').classList.remove('hidden'); }
  $('fsBtn').addEventListener('click', e => { e.currentTarget.blur(); toggleFull(); });
  $('fsRotate').addEventListener('click', goFull);
  ['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
    updFsBtn(); setTimeout(resize, 120);
    if (isFull() && G_ && !G_.over) getReady(); // 等系統的全螢幕提示消失再開打
  }));
  // 開打前倒數：讓瀏覽器的全螢幕提示先消失，這段時間按鈕不會誤觸
  let readyT = 0;
  function getReady() { readyT = 3.6; keys.left = keys.right = false; pendingSwing = null; if (G_ && G_.state === 'serve' && G_.ps + G_.as === 0) coachSay(T().intros[G_.level], 4500); }

  // ---------- 偵測環境 ----------
  const GAME_URL = 'https://poggyrappy.github.io/badminton-game/';
  const UA = navigator.userAgent;
  const inApp = isTouch && (/; wv\)/.test(UA) || /Claude|Line\/|FBAN|FBAV|Instagram|Messenger|MicroMessenger/i.test(UA) ||
    (/iPhone|iPad|iPod/.test(UA) && !/Safari\//.test(UA)));
  const inFrame = (() => { try { return window.top !== window.self; } catch (e) { return true; } })();
  const standalone = window.matchMedia('(display-mode: fullscreen)').matches || window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const canInstallHere = !inFrame && !standalone;
  let installEvt = null;
  if (canInstallHere) window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; updInstallUI(); });
  window.addEventListener('appinstalled', () => { installEvt = null; store.set('bd_installed', '1'); updInstallUI(); });

  // ---------- 畫面切換 ----------
  const SCREENS = ['gate', 'menu', 'home', 'over'];
  function showScreen(id) { SCREENS.forEach(s => $(s).classList.toggle('hidden', s !== id)); document.body.classList.toggle('inMatch', !id); }
  function overlayOpen(id) { $(id).classList.remove('hidden'); }
  function overlayClose(id) { $(id).classList.add('hidden'); }
  function notice(text) { $('noticeTxt').innerHTML = text; overlayOpen('notice'); }
  $('noticeOk').addEventListener('click', () => overlayClose('notice'));

  // ---------- 安裝畫面 ----------
  function gateMode() { return inApp ? 'inapp' : isIOS ? 'ios' : 'android'; }
  function updInstallUI() {
    const t = T(), m = gateMode();
    $('gateSteps').innerHTML = m === 'inapp' ? t.inappSteps : m === 'ios' ? t.iosInstallSteps : (installEvt ? t.gateAndroidReady : t.gateAndroidSteps);
    $('gateBtn').textContent = m === 'inapp' ? t.copyUrl : m === 'ios' ? t.gotIt : t.installBtn;
    $('gateBtn').classList.toggle('hidden', m === 'android' && !installEvt);
    $('homeInstall').classList.toggle('hidden', !(canInstallHere && isTouch && store.get('bd_installed', '') !== '1'));
  }
  $('gateBtn').addEventListener('click', async () => {
    const m = gateMode();
    if (m === 'inapp') {
      try { await navigator.clipboard.writeText(GAME_URL); $('urlToast').textContent = T().urlCopied; }
      catch (e) { const b = $('urlBox'); b.value = GAME_URL; b.classList.remove('hidden'); b.select(); $('urlToast').textContent = T().urlFail; }
    } else if (m === 'ios') afterGate();
    else if (installEvt) { installEvt.prompt(); try { const r = await installEvt.userChoice; if (r && r.outcome === 'accepted') store.set('bd_installed', '1'); } catch (e) {} installEvt = null; updInstallUI(); }
  });
  $('gateSkip').addEventListener('click', () => { try { sessionStorage.setItem('bd_skip', '1'); } catch (e) {} afterGate(); });
  $('homeInstall').addEventListener('click', () => {
    if (installEvt) $('gateBtn').click();
    else { updInstallUI(); $('gateSkip').classList.add('hidden'); showScreen('gate'); $('gateSkip').classList.remove('hidden'); }
  });

  // ---------- 開場流程：安裝畫面 → 第一次取名 → 主頁 ----------
  function boot() {
    let skipped = false; try { skipped = sessionStorage.getItem('bd_skip') === '1'; } catch (e) {}
    if (isTouch && canInstallHere && !skipped) { updInstallUI(); showScreen('gate'); }
    else afterGate();
  }
  function afterGate() {
    if (!store.get('bd_name', '')) { $('nameIn').value = ''; showScreen('menu'); }
    else showHome();
  }

  // ---------- 進度與紀錄（存在這支手機／電腦） ----------
  const REC0 = { matches: 0, wins: 0, cleared: 0, smash: 0, longest: 0, points: 0, shots: {} };
  function getRec() { try { return Object.assign({}, REC0, JSON.parse(store.get('bd_rec', '{}'))); } catch (e) { return Object.assign({}, REC0); } }
  function setRec(r) { store.set('bd_rec', JSON.stringify(r)); }
  function nextStage() { return Math.min(getRec().cleared, LEVELS.length - 1); }

  // ---------- 主頁 ----------
  function showHome() {
    const t = T(), r = getRec(), ns = nextStage();
    G_ = null; paused = false; clearHud();
    $('homeHi').textContent = t.homeHi(playerName());
    $('contBtn').textContent = r.cleared >= LEVELS.length ? t.contChamp : t.cont(ns + 1, t.levels[ns]);
    $('stageSel').innerHTML = LEVELS.map((L, i) => {
      const open = i <= r.cleared, done = i < r.cleared;
      return `<button data-st="${i}" class="${done ? 'done' : ''}" ${open ? '' : 'disabled'}>${open ? (done ? '✓ ' : '') : '🔒 '}${t.stage(i + 1)}<small>${t.levels[i]}</small></button>`;
    }).join('');
    $('stageSel').querySelectorAll('button').forEach(b => b.addEventListener('click', () => playStage(+b.dataset.st)));
    updInstallUI();
    showScreen('home');
  }
  function clearHud() {
    ['msg', 'hint'].forEach(id => $(id).textContent = '');

  function update(dt) {
    updZone(); updFeintCue();
    if (document.body.classList.contains('portrait')) { keys.left = keys.right = false; return; } // 直向先暫停
    if (readyT > 0) {
      readyT -= dt;
      const n = Math.ceil(readyT / 1.2);
      $('msg').style.opacity = 1; $('msg').style.color = '#ffe066';
      $('msg').textContent = T().ready(n);
      if (readyT <= 0) { const g = G_; if (g && g.ps + g.as === 0) umpire(T().callStart); else showMsg('', '#fff'); }
      return;
    }
    const g = G_; if (!g || g.over || paused) return;
    const p = g.p;
    let mv = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    p.x += mv * (g.state === 'serve' ? 2.5 : 5.2) * dt; // 發球前可以慢慢調整站位
    p.x = Math.max(0.2, Math.min(NET_X - 0.35, p.x));
    updPlayer(p, dt); updPlayer(g.a, dt);

    if (g.state === 'serve') {
      if (g.server === 'a') { g.timer += dt; if (g.timer > 1.1) doServe('a'); }
      return;
    }
    if (g.state === 'point') { g.timer += dt; if (g.timer > 2.0) afterPoint(); return; }

    const b = g.b;
    if (pendingSwing) {
      pendingT -= dt;
      // 提早按：等球到身體前方剛好的位置才擊出（力道最穩）
      if (inZone(p, b) && ((b.x - p.x) <= 0.45 || pendingT <= 0.05 || b.y < 0.5)) { hit('p', pendingSwing === 'drop', { fwd: pendingFwd || keys.right, feint: pendingFeint, fakeKind: pendingFake }); pendingSwing = null; pendingFeint = false; }
      else if (pendingT <= 0) { pendingSwing = null; pendingFeint = false; }
    }
    aiThink(dt);

    const prevX = b.x;
    for (let i = 0; i < 4; i++) step(b, dt / 4);
    if (b.type === 'smash' || Math.hypot(b.vx, b.vy) > 14) g.trail.push({ x: b.x, y: b.y, life: 0.25 });
    // 掛網
    if (!b.net && (prevX - NET_X) * (b.x - NET_X) <= 0 && b.y < NET_H) {
      b.net = true; b.x = NET_X + (prevX < NET_X ? -0.05 : 0.05); b.vx = -b.vx * 0.08; b.vy = Math.min(b.vy, 0) * 0.3;
      showMsg(T().netHit, '#ff8a8a'); netSound();
    }
    if (b.y <= 0) {
      b.y = 0; floorSound();
      let winner, shortSv = false;
      const inside = b.x >= 0 && b.x <= COURT;
      if (b.net) winner = b.last === 'p' ? 'a' : 'p';
      else if (b.type === 'serve' && Math.abs(b.x - NET_X) < 1.98 && (b.x - NET_X) * (b.last === 'p' ? 1 : -1) > 0) { shortSv = true; winner = b.last === 'p' ? 'a' : 'p'; showMsg(T().shortServe, '#ff8a8a'); }
      else if (inside) winner = b.x < NET_X ? 'a' : 'p';
      else { winner = b.last === 'p' ? 'a' : 'p'; showMsg(T().out, '#ff8a8a'); }
      // 失分原因（給戰術提示用）
      let cause = null;
      if (b.last === 'p') cause = b.net ? 'net' : shortSv ? 'serve' : !inside ? 'out' : 'net';
      else cause = (b.type === 'smash' || b.type === 'kill') ? 'smash' : (b.x > G_.p.x ? 'front' : 'deep');
      scorePoint(winner, inside && !b.net && !shortSv, cause);
    }
  }

    if (cause === 'svline' || cause === 'rcvline') { coachSay(TIPS[cause]); return; } // 發球犯規馬上提醒
    if (w === 'p') {

      return;
    }
    c.streak++; c.counts[cause] = (c.counts[cause] || 0) + 1;

    else if ((c.streak >= 3 || (g.as >= 3 && g.ps === 0)) && (c.shown.attack || 0) < 2) { tip = 'attack'; c.streak = 0; }
    if (tip) { c.shown[tip] = (c.shown[tip] || 0) + 1; coachSay(TIPS[tip]); }
  }

  function scorePoint(w, clean, cause) {
    const g = G_, bb = g.b || {};

    if (w === 'p') { g.ps++; g.stats.total++; if ((bb.type === 'smash' || bb.type === 'kill') && bb.last === 'p') g.stats.smash++; }
    else g.as++;

    if (paused) return;
    if (c === 'ArrowLeft' || c === 'KeyA') keys.left = true;

    if ((c === 'ArrowUp' || c === 'KeyW') && !e.repeat) playerJump();

    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    const s = Math.max(1, S_ / 32);
    ctx.fillStyle = 'rgba(255,255,255,.95)';
    ctx.beginPath(); ctx.moveTo(-2 * s, -3 * s); ctx.lineTo(-14 * s, -7 * s); ctx.lineTo(-14 * s, 7 * s); ctx.lineTo(-2 * s, 3 * s); ctx.fill();
    ctx.strokeStyle = 'rgba(180,180,180,.8)'; ctx.lineWidth = 0.8;
    ctx.beginPath(); ctx.moveTo(-14 * s, -3 * s); ctx.lineTo(-3 * s, -1 * s); ctx.moveTo(-14 * s, 3 * s); ctx.lineTo(-3 * s, 1 * s); ctx.stroke();
    ctx.fillStyle = '#f4e3c3'; ctx.beginPath(); ctx.arc(0, 0, 3.6 * s, 0, 7); ctx.fill();
    ctx.restore();
  }

  const menuP = { x: 4.6, y: 0, side: 'p', swingT: -1 }, menuA = { x: 8.8, y: 0, side: 'a', swingT: -1 };
  function draw(t, dt) {
    ctx.clearRect(0, 0, W, H);
    drawCourt();
    const g = G_;
    if (!g) { // 選單背景
      drawPlayer(menuP, '#5ce1c6', t, dt);
      drawPlayer(menuA, LEVELS[0].color, t, dt);
      return;
    }
    // 殘影
    for (const tr of g.trail) tr.life -= 1 / 60;
    g.trail = g.trail.filter(tr => tr.life > 0);
    for (const tr of g.trail) { ctx.fillStyle = `rgba(255,224,102,${tr.life * 2})`; ctx.beginPath(); ctx.arc(px(tr.x), py(tr.y), 3, 0, 7); ctx.fill(); }
    g.p.serving = g.state === 'serve' && g.server === 'p'; g.a.serving = g.state === 'serve' && g.server === 'a';
    drawPlayer(g.p, '#5ce1c6', t, dt);
    drawPlayer(g.a, LEVELS[g.level].color, t, dt);
    if (g.b) drawShuttle(g.b);
    else if (g.state === 'serve') {
      const sv = g[g.server];
      drawShuttle({ x: sv.x + (g.server === 'p' ? 0.45 : -0.45), y: 1.0, vx: 0, vy: -1 });
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.033, (now - last) / 1000); last = now;
    update(dt); camera(dt); draw(now / 1000, dt);
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script>
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
